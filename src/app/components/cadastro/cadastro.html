<section class="flex justify-center" aria-labelledby="titulo-cadastro">
  <div class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h1 id="titulo-cadastro" class="text-2xl font-semibold text-slate-900">Criar conta</h1>
    <p class="mt-2 mb-6 text-sm text-slate-600">Cadastro no SistemaRH.</p>

    <form class="space-y-4">
      <div>
        <label for="cadastro-nome" class="mb-1 block text-sm font-medium">Nome</label>
        <input
          id="cadastro-nome"
          name="nome"
          type="text"
          autocomplete="name"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />
      </div>

      <div>
        <label for="cadastro-email" class="mb-1 block text-sm font-medium">E-mail</label>
        <input
          id="cadastro-email"
          name="email"
          type="email"
          autocomplete="email"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />
      </div>

      <div>
        <label for="cadastro-senha" class="mb-1 block text-sm font-medium">Senha</label>
        <input
          id="cadastro-senha"
          name="senha"
          type="password"
          autocomplete="new-password"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />
      </div>

      <div>
        <label for="cadastro-confirmacao" class="mb-1 block text-sm font-medium"
          >Confirmação de senha</label
        >
        <input
          id="cadastro-confirmacao"
          name="confirmacaoSenha"
          type="password"
          autocomplete="new-password"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />
      </div>

      <button
        type="button"
        class="w-full cursor-pointer rounded-md bg-indigo-700 px-4 py-2 font-medium text-white hover:bg-indigo-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      >
        Cadastrar
      </button>
    </form>

    <p class="mt-6 text-center text-sm">
      <a
        routerLink="/login"
        class="text-indigo-700 hover:underline focus-visible:outline-2 focus-visible:outline-indigo-600"
        >Já possui uma conta? Entre</a
      >
    </p>
  </div>
</section>
