<section class="flex justify-center" aria-labelledby="titulo-login">
  <div class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <h1 id="titulo-login" class="text-2xl font-semibold text-slate-900">Login no SistemaRH</h1>
    <p class="mt-2 mb-6 text-sm text-slate-600">Entre na sua conta.</p>

    <form class="space-y-4">
      <div>
        <label for="login-email" class="mb-1 block text-sm font-medium">E-mail</label>
        <input
          id="login-email"
          name="email"
          type="email"
          autocomplete="email"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />
      </div>

      <div>
        <label for="login-senha" class="mb-1 block text-sm font-medium">Senha</label>
        <input
          id="login-senha"
          name="senha"
          type="password"
          autocomplete="current-password"
          class="w-full rounded-md border border-slate-300 px-3 py-2 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-200"
        />
      </div>

      <button
        type="button"
        class="w-full cursor-pointer rounded-md bg-indigo-700 px-4 py-2 font-medium text-white hover:bg-indigo-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
      >
        Entrar
      </button>
    </form>

    <p class="mt-6 text-center text-sm">
      <a
        routerLink="/cadastro"
        class="text-indigo-700 hover:underline focus-visible:outline-2 focus-visible:outline-indigo-600"
        >Não possui uma conta? Cadastre-se</a
      >
    </p>
  </div>
</section>
